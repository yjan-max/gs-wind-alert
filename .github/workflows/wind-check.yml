name: 고성 풍속 자동 알림

on:
  # 트리거 = 외부 cron-job.org(매 30분)만 사용.
  # (2026-06-29~2026-08-21) GitHub 내장 schedule 백업을 같이 켜뒀었으나, cron-job.org와 겹쳐
  # 실행 횟수가 사실상 2배가 되면서 GitHub Actions 무료 사용량(월 2,000분)을 예상보다 빨리
  # 소진 → 2026-08-14부터 계정 결제 문제로 전체 실행이 막히는 사고로 이어짐. 원인 규명 후
  # 2026-08-21 내장 schedule 제거, cron-job.org 단일 트리거로 복귀(사용량 절감 우선).
  # ⚠️ cron-job.org 자체가 죽으면(과거 2026-06-03~약 3주 사례 있음) 다시 감시 공백이 생길 수
  # 있음 — watchdog.yml(매시간, 별도 GitHub 내장 cron)이 그 경우를 감지해 재트리거함.
  workflow_dispatch:

# 기상특보 상태파일(warn_state.json) 커밋용 write 필요.
# ⚠️ private 리포라 permissions 블록을 쓰면 나머지 권한이 none이 됨 → checkout(클론)용 contents 를 반드시 포함.
#    contents: write 는 read 를 포함하므로 checkout 도 정상.
permissions:
  contents: write

jobs:
  check-wind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USER_MENTION: ${{ secrets.SLACK_USER_MENTION }}
          KMA_NX: ${{ vars.KMA_NX }}
          KMA_NY: ${{ vars.KMA_NY }}
        run: python check_wind.py
      # 기상특보 발효/해제 변화가 있을 때만 warn_state.json 이 바뀜 → 그때만 커밋.
      - name: Commit warning state if changed
        if: always()
        run: |
          if [ -n "$(git status --porcelain warn_state.json)" ]; then
            git config user.name "gs-wind-bot"
            git config user.email "actions@users.noreply.github.com"
            git add warn_state.json
            git commit -m "chore: update warn_state"
            git pull --rebase --autostash origin main || true
            git push || echo "state push skipped (concurrent run race)"
          else
            echo "no warn_state change"
          fi
