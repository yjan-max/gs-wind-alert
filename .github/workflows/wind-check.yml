name: 고성 풍속 자동 알림

on:
  # 1차 트리거 = 외부 cron-job.org(매 30분). 그게 멈춰도(2026-06-03~ 약 3주 죽었던 적 있음) 강풍 감시 공백이 안 생기게
  # GitHub 내장 cron 백업 추가(2026-06-29). 내장 cron은 지연·누락 가능하나 죽은 것보단 낫고, 둘 겹쳐도 멱등(고풍속 아니면 무알림).
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# 기상특보 상태파일(warn_state.json) 커밋용 write 필요.
# ⚠️ private 리포라 permissions 블록을 쓰면 나머지 권한이 none이 됨 → checkout(클론)용 contents 를 반드시 포함.
#    contents: write 는 read 를 포함하므로 checkout 도 정상.
permissions:
  contents: write

jobs:
  check-wind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USER_MENTION: ${{ secrets.SLACK_USER_MENTION }}
          KMA_NX: ${{ vars.KMA_NX }}
          KMA_NY: ${{ vars.KMA_NY }}
        run: python check_wind.py
      # 기상특보 발효/해제 변화가 있을 때만 warn_state.json 이 바뀜 → 그때만 커밋.
      # 동시 실행(cron-job.org + 내장 cron) 충돌로 push 실패해도 무시(알림은 이미 전송됨, 다음 주기 정합).
      - name: Commit warning state if changed
        if: always()
        run: |
          if [ -n "$(git status --porcelain warn_state.json)" ]; then
            git config user.name "gs-wind-bot"
            git config user.email "actions@users.noreply.github.com"
            git add warn_state.json
            git commit -m "chore: update warn_state"
            git pull --rebase --autostash origin main || true
            git push || echo "state push skipped (concurrent run race)"
          else
            echo "no warn_state change"
          fi
