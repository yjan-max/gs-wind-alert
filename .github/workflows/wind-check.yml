name: 고성 풍속 자동 알림

on:
  # 정기 실행은 외부 cron-job.org(매 30분)가 담당. GitHub 내장 cron은 지연·누락이 잦아 제거함.
  workflow_dispatch:

jobs:
  check-wind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USER_MENTION: ${{ secrets.SLACK_USER_MENTION }}
          KMA_NX: ${{ vars.KMA_NX }}
          KMA_NY: ${{ vars.KMA_NY }}
        run: python check_wind.py
