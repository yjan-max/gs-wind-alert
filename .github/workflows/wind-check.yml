name: 고성 풍속 자동 알림

on:
  # 1차 트리거 = 외부 cron-job.org(매 30분). 그게 멈춰도(2026-06-03~ 약 3주 죽었던 적 있음) 강풍 감시 공백이 안 생기게
  # GitHub 내장 cron 백업 추가(2026-06-29). 내장 cron은 지연·누락 가능하나 죽은 것보단 낫고, 둘 겹쳐도 멱등(고풍속 아니면 무알림).
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check-wind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USER_MENTION: ${{ secrets.SLACK_USER_MENTION }}
          KMA_NX: ${{ vars.KMA_NX }}
          KMA_NY: ${{ vars.KMA_NY }}
        run: python check_wind.py
