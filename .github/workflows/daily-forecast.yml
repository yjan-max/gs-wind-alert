name: 고성 당일 풍속 예보 알림

on:
  # 1차 정기 실행 = 외부 cron-job.org(KST 09:10).
  # 백업 = GitHub 내장 cron(KST 09:40 = 00:40 UTC). cron-job.org 가 죽어도(2026-06 약 3주 사망 전례)
  # 당일예보와 dead-man 이 계속 돌게 한다. 내장 cron 은 지연 가능하나 죽은 것보단 낫다(wind-check 과 동일 사상).
  # 이중 발송은 daily_forecast.py 의 already_posted_today() 가 '오늘 이미 성공 발송' 이면 skip 해서 방지한다.
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:

jobs:
  daily-forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # private 리포 checkout(클론)용 — 없으면 Repository not found 발생
      actions: read   # check_wind 워크플로우 최근 실행시각 조회용(dead-man 점검)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USER_MENTION: ${{ secrets.SLACK_USER_MENTION }}
          KMA_NX: ${{ vars.KMA_NX }}
          KMA_NY: ${{ vars.KMA_NY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # dead-man: check_wind 최근 실행 점검(actions:read)
        run: python daily_forecast.py
