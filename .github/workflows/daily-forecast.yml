name: 고성 당일 풍속 예보 알림

on:
  # 정기 실행은 외부 cron-job.org(KST 09:10)가 담당. GitHub 내장 cron은 지연·누락이 잦아 제거함.
  workflow_dispatch:

jobs:
  daily-forecast:
    runs-on: ubuntu-latest
    permissions:
      actions: read   # check_wind 워크플로우 최근 실행시각 조회용(dead-man 점검)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USER_MENTION: ${{ secrets.SLACK_USER_MENTION }}
          KMA_NX: ${{ vars.KMA_NX }}
          KMA_NY: ${{ vars.KMA_NY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # dead-man: check_wind 최근 실행 점검(actions:read)
        run: python daily_forecast.py
